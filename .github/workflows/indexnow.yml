# Tells Bing (and other IndexNow search engines) about every page in the
# sitemap after each push to main. ChatGPT search draws on Bing's index.
name: IndexNow

on:
  push:
    branches: [main]
    paths: ['**.html', 'sitemap.xml']
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the Vercel production deploy
        run: sleep 90
      - name: Submit sitemap URLs to IndexNow
        run: |
          KEY=$(ls *.txt | grep -E '^[0-9a-f]{32}\.txt$' | head -1 | sed 's/\.txt$//')
          URLS=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's/<\/\?loc>//g' | python3 -c 'import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          BODY=$(printf '{"host":"www.wattsterdam.nl","key":"%s","keyLocation":"https://www.wattsterdam.nl/%s.txt","urlList":%s}' "$KEY" "$KEY" "$URLS")
          echo "$BODY"
          CODE=$(curl -s -o response.txt -w '%{http_code}' -X POST 'https://api.indexnow.org/indexnow' -H 'Content-Type: application/json; charset=utf-8' -d "$BODY")
          echo "IndexNow responded $CODE"; cat response.txt
          case "$CODE" in 200|202) ;; *) exit 1 ;; esac
